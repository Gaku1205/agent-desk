<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agent-desk</title>
<!--
  案D「流れ × 誌面」── 設計表（案A「流れ」と案B「誌面」の組み合わせ）

  体験の核
    夜の地を左から右へ流れる光の粒の中に、自分の Issue が段階ごとに浮かんでいて、
    その同じ流れが左下の極太の数字の中も通り抜けている。
    ボタンを押すと、その Issue の光が次の段階へ跳ねて流れに戻り、数字が1つ転がって減る。

  組み合わせ方（何をどこに置くか）
    上 ≈ 45%  … 案A の流れ。段階の目盛り（端）、Issue の光の粒、色で状態、霧。
                 「動いている」「待っている」の一覧はここが兼ねる（案Bの表は置かない）
    下（すりガラス、端は消す）… 案B の誌面。
                 [巨大な数字 ＋ 小さい「件」] | [押す列：種類の名札・題名・理由・ボタン・目盛り] | [出来事：Issue ごとにまとめた列]
    生きている映像は1系統：画面の川の粒が、巨大な数字の中も同じ向き・同じ速さで通る（数字は流れを見る窓）。
    脈打ち・尾は減らす（AI の番の体だけ、進む向きに短い尾）。毎日見て疲れない量にする

  直した所
    A：1024〜1440px で題名が「…」で切れる → 名札を 2〜3 列ぶん横に伸ばし、隣の列と行（レーン）が被らないよう詰める。
       それでも入らないときだけ、公開済みを1つの光にまとめる。大画面では文字と光を幅に応じて大きく（11.5→15px、光 ×1.5）
    B：驚きが控えめ → 画面の上半分が流れ。数字の中も流れ。 1280〜1440 で普通のリスト → 一覧は流れに置き換え、下は押す列と出来事だけ
    スマホ：流れは縦（A）。下は数字・押す列・出来事（B）。出来事は日ごとのタブで畳む

  構図（PC ≥1180）                                                   構図（900〜1179）             構図（スマホ）
  ┌────────────────────────────────────────────────────────┐   ┌──────────────────────┐   ┌────────────┐
  │ agent-desk  全部 8 10  todo-app  landing-page   デモ 再生 同期 設定│   │ 同上                  │   │ ≡ agent-desk ▶│
  │ 清書 6 ┆ 実装 2 ┆ PR 2 ┆ CI 3 ┆ ﾚﾋﾞｭｰ 1 ┆ 修正 2 ┆ ﾏｰｼﾞ 4 ┆ 公開 6 ● ● ● │   │ 清書 … 公開            │   │清書 ● ● ● ●  │ 流れは上→下
  │  ◉ #31 保留中 題名            ◉ #23 止まっています 題名    ◎ #12 … │   │  ◉     ◉   ●    ◎     │   │実装 ●        │
  │  ◉ #13 …      ●→ #16 …                  ●→ #17 …   ◉ #22 … ◎ #11 │   │  ●→   ●→   ◉    ◎     │   │PR   ◉ ◉      │
  │  ●  #24 …          ◉ #7 …    ×  #18 …      ●→ #2 …  ●  #5 …  ◎ … │   │                        │   │…            │
  │ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ すりガラス（端は消える） ─ ─ ─ ─ ─ ─ ─ ─ │   ├ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ┤   ├ ─ ─ ─ ─ ─ ─┤
  │  8 件      │ 止まった todo-app#23 PR #38       46分 │ 出来事  今日 16 │   │  8 件 │ 止まった …      │   │ 8 件 あなたの番│
  │ あなたの番 │ 通知の音を設定で変えられるようにする       │ landing-page#8 │   │ あなた │ 題名           │   │ 止まった …    │
  │ 待ちが長い順│ AIが2回直しても…  [再開] ログを開く ━━━ 修正│  11:15 PR … │   │ の番  │ [再開]         │   │ 題名 [再開]   │
  │ todo-app 5│ PR作成待ち landing-page#6          1日 │ landing-page#4 │   │       │ …              │   │ …           │
  │           │ 英語のページを足す      [PRを作る] ━━ PR │  …           │   │ 出来事（横いっぱい）      │   │ 出来事 今日 昨日│
  └────────────────────────────────────────────────────────┘   └──────────────────────┘   └────────────┘
  ◉ = あなたの番（アンバー、大きく静かに光る）  ●→ = AIの番（青、進む向きに短い尾）
  ◎ = 待機（紫、ゆっくり回る）  × = 失敗（赤、じっと）  ◎ = 公開済み（緑、右端へ抜けて消える）
  列や帯は線で区切らず余白で区切る。板で画面を分けない：映像は端まで、文字の後ろだけ blur、その端は mask で消す

  色
    --bg     #0B0C10  夜（少し青い）        --bone   #ECE8DF  文字      --bone-2 #A9A59C  説明    --mute #6B6963  補足・名札
    --you    #F5A73A  あなたの番（アンバー。巨大な数字の光も）   --ai #5B8DFF  AIの番（信号の青）
    --q      #9B7CF5  待機     --fail #F25C5C  失敗     --done #4DD39A  公開済み
  文字
    見出し・巨大な数字・ワードマーク：Bricolage Grotesque 800（opsz 96、字間 -0.06em）
    本文：IBM Plex Sans JP（和文）＋ Geist（欧文・数字、tabular-nums）
    段：巨大 120〜320px ／ 単位「件」30px ／ 題名 16px ／ 本文 13.5px ／ 小 12px ／ 流れの名札 11.5〜15px（幅で変える）
  動き
    川：24px/s ＋ curl ノイズ。数字の中の粒も同じ向き・同じ速さ。体の粒の公転 0.3〜0.6 rad/s。AIの番だけ短い尾
    体の移動：ばね k=140 c=20（段階が進むと前の位置から流れて移る）
    押す → 100ms 以内：ボタンが縮む(.96) → 行が畳まれる(360ms, cubic-bezier(.2,.8,.2,1)) → 数字が転がる(460ms)。体が次の段階へ跳ねて粒が12個噴く
    再生 ▶ → 4秒ごとに todo-app#24 の段階が1つ進む
    prefers-reduced-motion：川と粒は止まる。ばね・畳み・転がりは無し（即時）
-->
<!-- 下書き（見本）。本番のコードではない。本番は next/font で読むが、ここでは Google Fonts から読む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@400..700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0B0C10; --bone:#ECE8DF; --bone-2:#A9A59C; --mute:#6B6963;
  --you:#F5A73A; --ai:#5B8DFF; --q:#9B7CF5; --fail:#F25C5C; --done:#4DD39A;
  --hair:rgba(236,232,223,.09); --hair-2:rgba(236,232,223,.05); --well:rgba(236,232,223,.06);
  --glass:rgba(11,12,16,.62);
  --jp:"Geist","IBM Plex Sans JP",system-ui,sans-serif;
  --num:"Geist","IBM Plex Sans JP",sans-serif;
  --disp:"Bricolage Grotesque","Geist",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gutter:clamp(20px,2.2vw,40px);
  --flowH:clamp(300px,45svh,660px);
  --nfs:clamp(11.5px,.23vw + 9.2px,15px);
  --giant:clamp(160px,13vw,340px);
}
@media (max-width:1299px){:root{--flowH:clamp(300px,50svh,560px)}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--bone);font-family:var(--jp);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{background:var(--bg);min-height:100svh;word-break:auto-phrase;overflow-wrap:anywhere;overflow-x:hidden;font-feature-settings:"palt"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
ol,ul{list-style:none}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--bone);border-radius:4px}
.num,time,.id,.wait,.sync{font-family:var(--num);font-variant-numeric:tabular-nums}
.ph{display:inline-block;margin-right:.2em}

/* ───────── 映像（画面の端まで） ───────── */
canvas.layer{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fog{z-index:0;opacity:.9}
#river{z-index:3}

.app{position:relative;z-index:1;min-height:100svh}

/* ───────── 上端の帯 ───────── */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:20px;padding:0 var(--gutter);height:52px;
  background:linear-gradient(var(--bg) 30%,rgba(11,12,16,0))}
.mark{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.045em;font-variation-settings:"opsz" 96;white-space:nowrap}
.repos{display:flex;gap:2px;min-width:0}
.tab{height:30px;padding:0 10px;border-radius:6px;color:var(--mute);display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;font-size:13px;transition:color .15s var(--ease),background .15s var(--ease)}
.tab:hover{color:var(--bone-2);background:var(--hair-2)}
.tab[aria-pressed="true"]{color:var(--bone);background:var(--well)}
.tab i{font-style:normal;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;display:inline-flex;gap:5px;font-weight:500}
.tab i b{font-weight:500;color:var(--you)}.tab i b+b{color:var(--ai)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:16px;white-space:nowrap}
.demo{display:flex;align-items:center;gap:8px;color:var(--bone-2);font-size:12.5px}
.demo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--q);box-shadow:0 0 10px var(--q)}
.play{height:30px;padding:0 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--bone);background:rgba(236,232,223,.09);transition:background .15s,transform .08s var(--ease)}
.play:hover{background:rgba(236,232,223,.15)}.play:active{transform:scale(.96)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px}
.sync::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ai)}
.gear{color:var(--mute);display:flex;align-items:center;gap:6px;font-size:12.5px;height:30px;padding:0 6px;border-radius:6px}
.gear:hover{color:var(--bone)}
.menu-btn{display:none;width:44px;height:44px;margin-left:-10px;align-items:center;justify-content:center;border-radius:8px}

/* ───────── 流れ ───────── */
.flow{position:relative;height:var(--flowH);overflow:hidden}
#nodes{font-size:var(--nfs)}
.stages{position:absolute;left:0;right:0;top:0;padding:4px var(--gutter) 0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));align-items:end;font-size:12px;color:var(--bone-2)}
.stages span{padding-left:26px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;position:relative}
.stages span::before{content:"";position:absolute;left:26px;bottom:-9px;width:1px;height:7px;background:var(--mute);opacity:.6}
.stages i{font-style:normal;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--mute)}
.caption{position:absolute;left:var(--gutter);right:var(--gutter);bottom:10px;z-index:5;font-size:12.5px;color:var(--bone-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none}
.caption.on{opacity:1}
.caption b{font-weight:500;color:var(--c,var(--bone))}
.caption .id{color:var(--mute);margin-right:8px}
.legend{grid-column:1/-1;display:flex;flex-direction:column;gap:7px;margin-top:22px;font-size:12px;color:var(--mute);white-space:nowrap}
.legend span{display:flex;align-items:center;gap:8px}
.legend span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}

.node{position:absolute;left:0;top:0;z-index:4;display:block;text-align:left;width:var(--w,120px);padding:2px 4px;border-radius:5px;
  transform:translate(var(--x),var(--y));will-change:transform;color:var(--bone-2);line-height:1.25;font-size:var(--nfs);transition:opacity .4s var(--ease)}
.node .l1{display:flex;gap:.5em;align-items:baseline;white-space:nowrap;overflow:hidden}
.node .id{flex:none;font-size:.92em;color:var(--mute)}
.node .st{min-width:0;color:var(--c);overflow:hidden;text-overflow:ellipsis;font-weight:500}
.node .t{display:block;font-size:.96em;color:var(--bone-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.node.flip{text-align:right}.node.flip .l1{justify-content:flex-end}
.node .rp{font-family:var(--num);font-size:.9em;color:var(--mute);margin-right:.5em}
.node.no-repo .rp{display:none}
.node.no-title .t{display:none}
.node:hover .t,.node:focus-visible .t{color:var(--bone)}
.node.off{opacity:0;pointer-events:none}
.m-stages{display:none}

/* ───────── 誌面（すりガラス、端は消す） ───────── */
.band{position:relative;z-index:2;padding:28px var(--gutter) 48px;min-height:calc(100svh - 52px - var(--flowH));
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 34px);mask-image:linear-gradient(to bottom,transparent,#000 34px);
  display:grid;gap:0 clamp(28px,3vw,64px)}
@media (min-width:1180px){.band{grid-template-columns:auto minmax(0,1fr) minmax(300px,31%)}}
@media (min-width:900px) and (max-width:1179px){.band{grid-template-columns:auto minmax(0,1fr)}.events{grid-column:1/-1;padding-top:34px}}

/* 巨大な数字 */
.hero{display:grid;grid-template-columns:auto auto;align-items:end;column-gap:6px;row-gap:8px;align-content:start;padding-top:2px}
.giant{position:relative;display:block;line-height:0;font-size:var(--giant);grid-row:1}
.giant canvas{display:block}
.giant .ghost{position:absolute;inset:0;font:800 1em/1 var(--disp);font-variation-settings:"opsz" 96;letter-spacing:-.06em;color:transparent;pointer-events:none}
.unit{grid-row:1;align-self:end;font:800 30px/1 var(--disp);letter-spacing:-.04em;color:var(--you);opacity:.8;padding-bottom:.12em}
.hero h1{grid-column:1/-1;font:500 16px/1.2 var(--jp);color:var(--bone);white-space:nowrap}
.hero h1 small{display:block;font:400 12.5px/1.3 var(--jp);color:var(--mute);margin-top:3px}
.hero .split{grid-column:1/-1;font-size:12.5px;color:var(--bone-2);white-space:nowrap}
.hero .split b{font-weight:500;color:var(--bone);font-family:var(--num);font-variant-numeric:tabular-nums}

/* 押す列 */
.turns{container-type:inline-size;min-width:0}
.rows{display:grid;grid-template-columns:minmax(0,1fr);column-gap:48px}
@container (min-width:1120px){.rows{grid-template-columns:1fr 1fr}}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:5px;padding:14px 0 16px;border-top:1px solid var(--hair);transition:background .5s var(--ease)}
.rows>.row:first-child{border-top-color:transparent}
.row.flash{background:rgba(245,167,58,.12);transition:none}
.r-head{display:flex;align-items:baseline;gap:10px;min-width:0}
.kind{font-size:12.5px;font-weight:500;color:var(--you);white-space:nowrap}
.kind.f{color:var(--fail)}
.row .id{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wait{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.r-title{font:500 16px/1.4 var(--jp);color:var(--bone);letter-spacing:-.005em}
.r-desc{font-size:13px;color:var(--bone-2);line-height:1.55}
.r-foot{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act{height:30px;padding:0 13px;border-radius:5px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--you);background:rgba(245,167,58,.09);box-shadow:inset 0 0 0 1px rgba(245,167,58,.4);
  transition:transform .12s var(--ease),background .12s,color .12s}
.act:hover{background:rgba(245,167,58,.18)}
.act:active,.act.hit{transform:scale(.96);background:var(--you);color:var(--bg)}
.act.fill{background:var(--you);color:#1a1206;box-shadow:none}
.act.fill:hover{background:#ffb95a}
.act.ghost{color:var(--bone-2);background:none;box-shadow:inset 0 0 0 1px rgba(236,232,223,.16)}
.act.ghost:hover{background:var(--well)}
.act.link{box-shadow:none;background:none;color:var(--bone-2);padding:0 6px}
.act.link:hover{color:var(--bone)}
.act:focus-visible{box-shadow:inset 0 0 0 1px rgba(245,167,58,.8),0 0 0 2px var(--bg),0 0 0 3.5px var(--bone)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.ticks{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:136px;flex:none}
.tk{height:3px;border-radius:2px;background:rgba(236,232,223,.1);transition:background .3s,box-shadow .3s}
.stage{font-size:12px;color:var(--bone-2);white-space:nowrap;font-weight:500}
.stage.f{color:var(--fail)}
.empty{color:var(--mute);font-size:13px;padding:14px 0 24px}

/* 出来事：Issue ごとにまとめた足あと */
.events{min-width:0}
.events h2{display:flex;align-items:baseline;gap:12px;margin:0 0 8px;font:500 15px/1 var(--jp);color:var(--bone)}
.events h2 .hint{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400;white-space:nowrap}
.days{display:flex;gap:2px;margin:0 0 6px}
.day{height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--bone-2);font-weight:500;transition:background .12s,color .12s;white-space:nowrap}
.day:hover{color:var(--bone)}
.day[aria-selected="true"]{background:var(--well);color:var(--bone)}
.day i{font-style:normal;margin-left:6px;color:var(--mute);font-weight:400;font-family:var(--num)}
.ev-g{padding:10px 0 11px;border-top:1px solid var(--hair-2)}
.ev-g:first-child{border-top-color:transparent}
.ev-g.new{animation:evin .5s var(--ease)}
@keyframes evin{from{opacity:0;transform:translateY(-6px)}}
.ev-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.ev-h .id{flex:none;font-size:12px;color:var(--mute)}
.ev-h .ttl{font-size:13px;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trail{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.trail li{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--bone-2);white-space:nowrap}
.trail time{font-size:11.5px;color:var(--mute)}
.trail i{width:6px;height:6px;border-radius:50%;background:var(--bone-2);flex:none}
.trail .y i{background:var(--you)} .trail .a i{background:var(--ai)} .trail .d i{background:var(--done)} .trail .f i{background:var(--fail)} .trail .o i{background:var(--mute)}
.trail .f{color:#FF8A8D} .trail .d{color:#7BDCAE} .trail .y{color:#FFC06A}
.more{margin-top:8px;font-size:12.5px;color:var(--bone-2);display:inline-flex;align-items:center;gap:6px;height:30px}
.more:hover{color:var(--bone)}
.more svg{width:10px;height:10px;transition:transform .15s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}

/* 知らせ */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);z-index:20;background:rgba(20,21,27,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--bone);font-size:12.5px;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s,transform .2s var(--ease);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ───────── スマホ（幅900px未満）：流れは縦、名札は左端 ───────── */
.sheet{display:none}
@media (max-width:899px){
  :root{--gutter:16px;--giant:128px}
  .top{position:fixed;top:0;left:0;right:0;z-index:6;gap:12px}
  .menu-btn{display:flex}
  .top .repos,.top .sync,.top .gear,.top .demo{display:none}
  .stages,.edge{display:none}

      else { if (p.y > H+6) { p.y = -6; p.x = Math.random()*W; } if (p.x<-6) p.x=W+6; if (p.x>W+6) p.x=-6; }
    }
    const tw = .55 + .45*Math.sin(t*1.1 + p.ph);
    let a = .15 * tw;
    if (p.y > bandTop) a *= .3;
    rctx.globalAlpha = a; const sz = 4*p.s; rctx.drawImage(sprites.river, p.x - sz/2, p.y - sz/2, sz, sz);
  }
  // 体
  const sc = mobile ? 1 : Math.min(1.5, Math.max(.9, colW/190));
  for (const b of bodies.values()) {
    if (!b.on) continue;
    const who = b.i.who, seedKey = who + (b.i.cluster ? b.i.count : '');
    if (b.seededFor !== seedKey) seedParts(b);
    // ばね
    if (!RM) { const k=140, c=20; b.vu += (k*(b.u-b.pu) - c*b.vu)*dt; b.vv += (k*(b.v-b.pv) - c*b.vv)*dt; b.pu += b.vu*dt; b.pv += b.vv*dt; }
    else { b.pu = b.u; b.pv = b.v; }
    b.hl += (b.hlT - b.hl) * Math.min(1, dt*10);
    const [x, y] = toXY(b.pu, b.pv);
    // 名札を追従（流れの中の座標）
    const lx = (mobile ? x + 9 : b.flip ? x - 19 - b.w : x + 18) - flowRect.ox, ly = (mobile ? y - 10 : y - labelFs*.65 - 3 + scrollY) - flowRect.oy;
    if (!(Math.abs(lx - b.lastX) <= .05 && Math.abs(ly - b.lastY) <= .05)) { b.el.style.setProperty('--x', lx+'px'); b.el.style.setProperty('--y', ly+'px'); b.lastX = lx; b.lastY = ly; }
    const dim = y > bandTop ? .3 : 1;
    const big = b.i.cluster ? 1.3 : 1;
    // 光
    let g = who==='human' ? .5 : who==='ai' ? .3 : who==='queue' ? .18 : who==='fail' ? .3 : .22;
    g = (g + b.hl*.35) * dim;
    let gr = (who==='human' ? 24 : who==='queue' ? 24 : 18) * sc * big; gr += b.hl*10;
    rctx.globalAlpha = g; rctx.drawImage(sprites[who+'_glow'], x-gr, y-gr, gr*2, gr*2);
    // 芯（公開済みのまとまりは、件数ぶんの小さな芯が寄り添う）
    rctx.globalAlpha = (who==='queue' ? .7 : 1) * dim; const cs = (who==='human' ? 7.5 : 6) * sc * big;
    if (b.i.cluster) { for (let c=0;c<b.i.count;c++) { const an = c*2.4 + .6, rr = (6 + c*3.2)*sc; rctx.drawImage(sprites[who], x+Math.cos(an)*rr-3, y+Math.sin(an)*rr*.7-3, 6, 6); } }
    else rctx.drawImage(sprites[who], x-cs/2, y-cs/2, cs, cs);
    // 粒
    for (let k = b.parts.length-1; k >= 0; k--) {
      const p = b.parts[k]; let px, py, a;
      if (p.type==='orbit' || p.type==='wide' || p.type==='still') {
        if (!RM) p.a += p.w*dt;
        const rr = p.r * sc * big * (1 + b.hl*.3);
        const jx = p.type==='still' ? Math.sin(t*9+p.ph)*.8 : 0;
        const du = Math.cos(p.a)*rr + jx, dv = Math.sin(p.a)*rr*.62;
        [px, py] = toXY(b.pu + du, b.pv + dv); a = (who==='queue' ? .5 : .85) * (.6 + .4*Math.sin(t*1.6+p.ph));
      } else if (p.type==='comet') {
        if (!RM) p.p += dt*p.sp; if (p.p >= 1) { if (p.spawned) { b.parts.splice(k,1); continue; } p.p = 0; p.off = Math.random()-.5; }
        const du = p.p*p.len*(mobile?.65:1), dv = p.off*14*(1-p.p) + Math.sin(p.p*6+p.ph)*2;
        [px, py] = toXY(b.pu + du, b.pv + dv); a = (1-p.p)*.9;
      } else { // exit：右端（下端）へ抜けて消える
        if (!RM) p.p += dt*p.sp; if (p.p >= 1) { p.p = 0; p.off = Math.random()-.5; }
        const edge = mobile ? (H - b.pu) : (W - b.pu);
        const du = p.p*p.p*edge, dv = p.off*18*big + Math.sin(p.p*8+p.ph)*3;
        [px, py] = toXY(b.pu + du, b.pv + dv); a = (1-p.p)*.55;
      }
      if (py > bandTop) a *= .3;
      rctx.globalAlpha = Math.max(0, a); const sz = 3*p.s*Math.min(1.3, sc); rctx.drawImage(sprites[who], px-sz/2, py-sz/2, sz, sz);
    }
  }
  rctx.globalAlpha = 1; rctx.globalCompositeOperation = 'source-over';
  drawFog();
  giant.draw(now, dt);
  requestAnimationFrame(frame);
}
// 霧（低解像度で描いて引き伸ばす。すりガラスがこれをぼかす）
let fogT = 0;
function drawFog(){
  fogT++; if (fogT % 3 !== 1 && fogT > 2) return;
  const w = fog.width, h = fog.height; fctx.clearRect(0,0,w,h);
  fctx.globalCompositeOperation = 'lighter';
  const blobs = [[.14,.42,'human',.2],[.55,.3,'ai',.18],[.9,.4,'done',.13],[.36,.7,'ai',.12],[.72,.74,'queue',.1]];
  for (const [bx,by,c,al] of blobs) {
    const x = (bx + .04*Math.sin(t*.09 + bx*9))*w, y = (by + .05*Math.cos(t*.07 + by*7))*h, r = Math.max(w,h)*.36;
    const g = fctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0, `rgba(${COL[c].join(',')},${al})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    fctx.fillStyle = g; fctx.fillRect(0,0,w,h);
  }
  fctx.globalCompositeOperation = 'source-over';
}

/* ───── 巨大な数字：流れを見る窓（川の粒が、同じ向き・同じ速さで数字の中を通る） ───── */
const giant = (() => {
  const el = $('#giant'), cv = $('#cv'), ghost = $('#ghost'), ctx = cv.getContext('2d');
  const field = document.createElement('canvas'), fc = field.getContext('2d');
  const tmp = document.createElement('canvas'), tc = tmp.getContext('2d');
  let value = 8, prev = null, roll = 1, rollT0 = 0, GW = 0, GH = 0, dpr = 1, fs = 0, ready = false, metrics = null, local = [];
  const font = () => `800 ${fs}px "Bricolage Grotesque"`;
  function layout(){
    fs = parseFloat(getComputedStyle(el).fontSize);
    ghost.textContent = String(value);
    ctx.font = font();
    const m = ctx.measureText(String(Math.max(value, prev ?? 0)));
    const asc = m.actualBoundingBoxAscent, des = m.actualBoundingBoxDescent;
    GW = Math.ceil(m.width - fs*0.06*(String(value).length-1)) + 4; GH = Math.ceil(asc+des) + 8;
    metrics = {asc, left: m.actualBoundingBoxLeft};
    dpr = Math.min(devicePixelRatio || 1, 2);
    el.style.width = GW+'px'; el.style.height = GH+'px';
    for (const c of [cv, field, tmp]) { c.width = Math.round(GW*dpr); c.height = Math.round(GH*dpr); c.style.width = GW+'px'; c.style.height = GH+'px'; }
    const n = Math.round(GW*GH/300); local = [];
    for (let k=0;k<n;k++) local.push({x: Math.random()*GW, y: Math.random()*GH, s: .6+Math.random()*1.2, ph: Math.random()*6.28, sp: .6+Math.random()*.8});
  }
  function drawField(now, dt, rect){
    const tt = RM ? 12 : t;
    fc.setTransform(dpr,0,0,dpr,0,0);
    fc.globalCompositeOperation = 'source-over'; fc.fillStyle = '#2A1804'; fc.fillRect(0,0,GW,GH);
    fc.globalCompositeOperation = 'lighter';
    // 土台の光（ゆっくり漂う2つ）
    const blobs = [['255,176,64',.9,.21,0],['255,118,34',.7,.16,2.1]];
    blobs.forEach(([c,a,sp,ph],i) => {
      const x = GW*(.5+.5*Math.sin(tt*sp+ph)), y = GH*(.5+.55*Math.cos(tt*sp*.8+ph*1.7)), r = Math.max(GW,GH)*(.6+.1*Math.sin(tt*.3+i));
      const g = fc.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${c},${a})`); g.addColorStop(1,`rgba(${c},0)`);
      fc.fillStyle = g; fc.fillRect(0,0,GW,GH);
    });
    // 数字の中の粒：画面の川と同じ式で動く
    for (const p of local) {
      if (!RM) {
        const q = {x: rect.left + p.x, y: rect.top + p.y, sp: p.sp}; flowStep(q, dt, t); p.x = q.x - rect.left; p.y = q.y - rect.top;
        if (!mobile) { if (p.x > GW+4) { p.x = -4; p.y = Math.random()*GH; } if (p.y<-4) p.y=GH+4; if (p.y>GH+4) p.y=-4; }
        else { if (p.y > GH+4) { p.y = -4; p.x = Math.random()*GW; } if (p.x<-4) p.x=GW+4; if (p.x>GW+4) p.x=-4; }
      }
      const tw = .55 + .45*Math.sin(tt*1.1 + p.ph);
      fc.globalAlpha = .55*tw; const sz = 7*p.s; fc.drawImage(sprites.amber, p.x - sz/2, p.y - sz/2, sz, sz);
    }
    // 画面の川の粒で、数字を通っている物はそのまま明るく
    for (const p of riverParts) {
      const x = p.x - rect.left, y = p.y - rect.top; if (x < -4 || y < -4 || x > GW+4 || y > GH+4) continue;
      fc.globalAlpha = .8; const sz = 9*p.s; fc.drawImage(sprites.amber, x - sz/2, y - sz/2, sz, sz);
    }
    fc.globalAlpha = 1; fc.globalCompositeOperation = 'source-over';
  }
  function glyph(text, dy, alpha){
    tc.setTransform(1,0,0,1,0,0); tc.globalCompositeOperation = 'source-over'; tc.clearRect(0,0,tmp.width,tmp.height);
    tc.save(); tc.scale(dpr,dpr); tc.font = font(); tc.textBaseline = 'alphabetic'; tc.letterSpacing = `${-0.06*fs}px`;
    tc.fillStyle = '#fff'; tc.fillText(text, metrics.left+2, metrics.asc+4+dy); tc.restore();
    tc.globalCompositeOperation = 'source-in'; tc.drawImage(field,0,0);
    ctx.globalAlpha = alpha; ctx.drawImage(tmp,0,0); ctx.globalAlpha = 1;
  }
  const ease = x => 1-Math.pow(1-x,3);
  let still = false;
  function draw(now, dt){
    if (!metrics || !ready) return;
    if (roll < 1) roll = Math.min(1, (now-rollT0)/460);
    if (RM && still && roll >= 1) return;
    const rect = cv.getBoundingClientRect();
    drawField(now, dt, rect);
    ctx.clearRect(0,0,cv.width,cv.height);
    if (roll < 1) { const p = ease(roll); glyph(String(prev), -GH*.9*p, 1-p); glyph(String(value), GH*.9*(1-p), p); }
    else glyph(String(value), 0, 1);
    if (RM) still = true;
  }
  function set(n){
    if (!ready) { value = n; return; }
    if (n === value) return;
    prev = value; value = n; still = false;
    if (RM) { roll = 1; layout(); return; }
    roll = 0; rollT0 = performance.now(); layout();
  }
  document.fonts.load('800 100px "Bricolage Grotesque"').then(() => { ready = true; layout(); });
  addEventListener('resize', () => { if (ready) layout(); });
  return {set, draw};
})();

/* ───── 再生 ───── */
const STEPS = [
 {at:0,who:'ai',st:'清書中'},
 {at:1,who:'ai',st:'AIが実装中',ev:['実装を依頼','o']},
 {at:2,who:'human',st:'PRを作れます',kind:'PR作成待ち',wait:0,desc:['AIの作業が終わりました。','PRを作るとCIが走ります'],acts:['PRを作る'],ev:['実装が終わった・PRを作れます','y']},
 {at:3,who:'ai',st:'CI 実行中 1/4',ev:['PRができた','a']},
 {at:4,who:'ai',st:'レビューAIが確認中',ev:['CI 4/4','a']},
 {at:5,who:'ai',st:'AIが修正中 1/2',why:'レビューの指摘を直しています（1/2回目）',ev:['修正を依頼 1/2','a']},
 {at:5,who:'ai',st:'修正を確認中',why:'直した結果を確認中（CI 2/4）'},
 {at:6,who:'ai',st:'自動でマージします',ev:['レビュー済・指摘なし','a']},
 {at:7,who:'ai',st:'本番に公開中',ev:['マージ','o']},
 {at:7,who:'done',st:'公開済み',ev:['本番に公開','d']},
];
let playI = 0, playTimer = null;
const playBtn = $('#playBtn');
function applyStep(idx){
  const s = STEPS[idx], i = ISSUES.find(x => x.play);
  Object.assign(i, {at:s.at, who:s.who, st:s.st, why:s.why||'', acts:s.acts||[], desc:s.desc||[], kind:s.kind||null, wait:s.wait??i.wait, human:false});
  if (s.ev) addTrail(i, s.ev[0], s.ev[1]);
  renderRepos(); renderTurn(); layout(true);
  const b = bodies.get(i.key); if (b) b.vu -= 60;
}
playBtn.onclick = () => {
  if (playTimer) return;
  if (playI >= STEPS.length-1) { playI = 0; applyStep(0); }
  playBtn.textContent = '再生中…';
  playTimer = setInterval(() => {
    playI++; applyStep(playI);
    if (playI >= STEPS.length-1) { clearInterval(playTimer); playTimer = null; playBtn.textContent = 'もう一度 ↺'; }
  }, 4000);
};
$('#gear').onclick = e => { e.preventDefault(); toast('設定（デモでは開きません）'); };

/* ───── メニュー（スマホ） ───── */
const sheet = $('#sheet'), menuBtn = $('#menuBtn');
function openMenu(){ sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false'); menuBtn.setAttribute('aria-expanded','true'); sheet.querySelector('button, a').focus(); }
function closeMenu(){ if (!sheet.classList.contains('open')) return; sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); menuBtn.setAttribute('aria-expanded','false'); menuBtn.focus(); }
menuBtn.onclick = openMenu; $('#scrim').onclick = closeMenu;
document.addEventListener('keydown', e => { if (e.key==='Escape') closeMenu(); });
window.__openMenu = openMenu;

/* ───── 起動 ───── */
renderRepos(); renderTurn(); renderEvents();
resize(); addEventListener('resize', () => { resize(); renderEvents(); });
requestAnimationFrame(now => { last = now; frame(now); });
document.fonts?.ready.then(() => layout(false));
})();
</script>
