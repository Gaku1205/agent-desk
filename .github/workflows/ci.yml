# 品質ゲート：PRごとに型チェック・リント・ビルドを回す。
# 合否はAIではなく、ここで決める。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: リント
        run: npm run lint
      - name: テスト
        run: npm run test
      - name: ビルド
        run: npm run build
      # 見た目のテスト（package.json に test:visual があるときだけ）。デモの画面のスクショを、前の画像と比べる
      - name: 見た目のテストがあるか
        id: visual
        run: echo "enabled=$(jq -r '.scripts["test:visual"] != null' package.json)" >> "$GITHUB_OUTPUT"
      - name: 見た目のテスト用のブラウザを入れる
        if: steps.visual.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      - name: 見た目のテスト
        if: steps.visual.outputs.enabled == 'true'
        run: npm run test:visual
      - name: 見た目のテストの結果（差分の画像）を残す
        if: failure() && steps.visual.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7
