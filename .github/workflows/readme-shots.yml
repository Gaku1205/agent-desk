# READMEの画像とGIFを、CIと同じ環境で撮ってPRのブランチにコミットする（npm run readme:shots）。
# 手で動かす：Actions → README Shots → Run workflow（ブランチ名を入れる）。
# ブランチ名を省くと main で撮って、PR（readme-shots/<番号>）にする（main の保護で、直接は入れられないため）。
# 安全のため2段に分ける：撮る（PRのコードを動かす。鍵を渡さない）→ 画像とGIFだけ取り出してコミット（鍵を使う。コードは動かさない）。
name: README Shots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "撮った画像をコミットするブランチ（省略すると main）"
        required: false
        default: ""

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # ここではブランチのコードを動かすので、鍵は使わず、トークンも残さない
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 画像とGIFを撮る
        run: npm run readme:shots
      - uses: actions/upload-artifact@v4
        with:
          name: readme-shots
          path: assets/readme
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: shoot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      # ここではコードを動かさない（npm も実行しない）。画像（png・gif）だけを取り出す
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || 'main' }}
          token: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: readme-shots
          path: ${{ runner.temp }}/shots
      - name: コミットする
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
          SHOTS: ${{ runner.temp }}/shots
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
        run: |
          git config user.name "agent-desk pipeline"
          git config user.email "noreply@github.com"
          (cd "$SHOTS" && find . -type f \( -name '*.png' -o -name '*.gif' \) -print0) | while IFS= read -r -d '' f; do
            mkdir -p "assets/readme/$(dirname "$f")"
            cp "$SHOTS/$f" "assets/readme/$f"
          done
          git add -A assets/readme
          if git diff --cached --quiet; then
            echo "変わった画像はありません"
            exit 0
          fi
          git commit -m "READMEの画像とGIFを撮る（CIの環境）"
          if [ "$BRANCH" != main ]; then
            git push origin "HEAD:$BRANCH"
            exit 0
          fi
          # main は保護されていて直接入れられないので、PRにする（CI → レビュー → 自動マージ）
          pr_branch="readme-shots/${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$pr_branch"
          gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="READMEの画像とGIFを撮り直す" -f head="$pr_branch" -f base=main \
            -f body="README Shots（手動実行）で、CIの環境で撮り直した画像とGIFです。画像だけの変更です。" -q .html_url
